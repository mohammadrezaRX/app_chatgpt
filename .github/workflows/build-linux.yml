name: Build Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Tk and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk build-essential patchelf

      - name: Install Nuitka
        run: python -m pip install --upgrade pip Nuitka

      - name: Build Linux binary
        run: python -m nuitka --mode=onefile --enable-plugin=tk-inter test_bat.py

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: test_bat-linux-x86_64
          path: test_bat.bin
